schema: pstack-skill-behavior/v1
authority: parent task only
cases:
  - id: read-heavy
    expected: bounded explorer roles aggregate into one parent-owned answer
    proof: child reports are treated as evidence, not completion
  - id: write-heavy
    expected: writers receive exclusive files or isolated worktrees before start
    proof: parent inspects the actual diff and runs authoritative verification
  - id: panel
    expected: independent readers use the same evidence and one synthesizer resolves disagreement
    proof: dissent and unavailable lanes remain visible
  - id: race
    expected: candidates write to isolated outputs and the parent selects and verifies a winner
    proof: no candidate writes another candidate's output
  - id: nested
    expected: each coordinator owns a bounded subtree and returns an aggregate
    proof: nesting depth and child capacity are checked before dispatch
  - id: unsafe-fanout
    expected: writable fanout is refused without exclusive ownership or isolation
    proof: no child starts
  - id: routine-parent-edit
    expected: a bounded understood reversible repository change proceeds sequentially in the parent
    proof: a cross-function edit passes its behavior check without a worker or architecture panel
  - id: substantial-design
    expected: competing durable-queue designs receive scoped architecture comparison and independent scrutiny of recovery invariants
    proof: the reason for coordination and the design question are stated; missing optional parallelism permits a disclosed sequential comparison
  - id: consequential-security-change
    expected: exact authorization and independent scrutiny precede the consequential transition
    proof: missing propagation or rollback proof gates application even when standing authorization exists
  - id: inherited-model-and-justified-override
    expected: model and effort inherit unless a supported override is justified
    proof: optional unavailable preferences do not block work; required model diversity remains gated and requested settings stay distinct from observed settings
  - id: unchanged-reviewed-artifact
    expected: reuse applicable review and verification instead of repeating unchanged checks
    proof: repeat only after changed evidence, failures, or unresolved risk invalidates prior proof
